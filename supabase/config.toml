
[functions.create-checkout-session]
enabled = true
verify_jwt = false
import_map = "./functions/create-checkout-session/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-checkout-session/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-checkout-session/*.html" ]

# Server-side email-existence check for the account gate -- uses the
# service-role key (see that function's own comment on why), so verify_jwt
# stays false the same way create-checkout-session's does: it must be
# callable by a guest with no session yet, gated only by the publishable
# apikey header supabase-js already sends.
[functions.check-email-exists]
enabled = true
verify_jwt = false
import_map = "./functions/check-email-exists/deno.json"
entrypoint = "./functions/check-email-exists/index.ts"

# Server-side promo code lookup for checkout.html's Promo Code field -- see
# that function's own comment for why (previously a hardcoded map shipped in
# js/cart.js). verify_jwt stays false the same way the other two do: it must
# be callable by a guest with no session yet, gated only by the publishable
# apikey header supabase-js already sends.
[functions.validate-promo-code]
enabled = true
verify_jwt = false
import_map = "./functions/validate-promo-code/deno.json"
entrypoint = "./functions/validate-promo-code/index.ts"

# Stripe webhook -- server-side source of truth for order completion (see
# that function's own header comment for the full picture, including the
# one manual Stripe Dashboard step this repo/CLI can't do for you).
# verify_jwt = false here for a DIFFERENT reason than the other three
# functions above: this isn't called by the browser at all (no apikey/JWT,
# no CORS) -- it's called directly by Stripe's own servers, authenticated
# entirely via the Stripe-Signature header this function verifies itself
# against STRIPE_WEBHOOK_SECRET. Supabase's platform-level JWT gateway check
# would reject every incoming Stripe request before this code ever ran if
# verify_jwt were true here, since Stripe never sends one.
[functions.stripe-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/stripe-webhook/deno.json"
entrypoint = "./functions/stripe-webhook/index.ts"

# admin.html's mark-as-shipped/correct-tracking action (js/admin.js). Unlike
# every function above, verify_jwt = true HERE -- this is the one function
# in this project that needs to know WHICH real, signed-in user is calling,
# so a valid Supabase JWT is required at the platform gateway before this
# code even runs (on top of the function's own is_admin check once it does
# -- see that file's own top comment on why both layers exist).
[functions.mark-order-shipped]
enabled = true
verify_jwt = true
import_map = "./functions/mark-order-shipped/deno.json"
entrypoint = "./functions/mark-order-shipped/index.ts"

# Abandoned-cart reminder sweep -- invoked only by pg_cron (see
# 20260819000100_schedule_abandoned_cart_reminders.sql), never by the
# browser. verify_jwt = true HERE for a different reason than
# mark-order-shipped above: this isn't identifying a real signed-in customer
# at all -- the cron job authenticates as this project's service role (its
# key IS a valid Supabase-signed JWT, so the platform gateway accepts it),
# and the function's own additional check (see its own top comment) confirms
# the bearer token is exactly that key, not just any authenticated user's.
[functions.send-abandoned-cart-reminders]
enabled = true
verify_jwt = true
import_map = "./functions/send-abandoned-cart-reminders/deno.json"
entrypoint = "./functions/send-abandoned-cart-reminders/index.ts"

# Supabase Auth's "Send Email" Hook -- replaces Supabase's own bare default
# templates (password reset, signup confirmation, email change) with this
# project's real dark/bronze branding + FR/EN support (see that function's
# own header comment, including the manual Dashboard steps needed to
# actually turn this on). verify_jwt = false for the same reason as
# stripe-webhook: called directly by Supabase's own Auth service, no
# apikey/JWT a browser call would carry -- trust comes entirely from the
# Standard Webhooks signature this function verifies itself against
# SEND_EMAIL_HOOK_SECRET.
[functions.send-auth-email]
enabled = true
verify_jwt = false
import_map = "./functions/send-auth-email/deno.json"
entrypoint = "./functions/send-auth-email/index.ts"
