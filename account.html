<!-- Account page — log in / create account / guest session, order history placeholder -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Matches --bg-void (css/style.css) -- explicit color for iOS/Android's
     status-bar/chrome tint instead of leaving it to auto-sample from page content. -->
<meta name="theme-color" content="#0a0908">
<title>MONARK — Account</title>
<meta name="description" content="Manage your MONARK account — log in, create an account, or continue as a guest.">

<!-- Favicon (bronze "M" monogram on dark) -->
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Referrer-Policy is the one HTTP security header a meta tag can actually
     set; CSP / X-Frame-Options / X-Content-Type-Options need real HTTP
     headers at the hosting level -- see README.md's Security section. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Transactional/account page, no unique content -- excluded from search
     indexing, same as checkout.html (see the note on sitemap.xml's inclusion
     of it anyway, in README.md). -->
<meta name="robots" content="noindex, nofollow">

<!-- PLACEHOLDER DOMAIN -- replace https://YOUR-DOMAIN-HERE.com with the real
     production domain once it's set, before launch. -->
<link rel="canonical" href="https://YOUR-DOMAIN-HERE.com/account.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;0,6..96,800;0,6..96,900;1,6..96,400&family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260719">
<link rel="stylesheet" href="css/cart.css?v=20260719">
</head>
<body class="shop-page">

<!-- FIXED HEADER -->
<header class="site-header">
  <nav class="site-nav">
    <a href="index.html" class="nav-logo">MONARK</a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav.experience">The Experience</a>
    </div>
  </nav>
</header>

<main class="checkout-page">
  <div class="checkout-inner">
    <a href="product.html" class="checkout-back-link" data-i18n="common.backToShop">&larr; Back to Shop</a>
    <h1 class="checkout-title" data-i18n="account.pageTitle">My Account</h1>

    <div id="account-step">
      <h2 class="checkout-section-heading" data-i18n="common.account">Account</h2>
      <!-- Filled by window.MonarkAccount.mountAccountGate() below -- same
           shared email/log-in/create-account flow checkout.html's own
           account step uses, see js/account.js. -->
      <div id="account-gate"></div>
    </div>

    <div id="account-order-history" hidden>
      <h2 class="checkout-section-heading" data-i18n="account.orderHistoryHeading">Order History</h2>
      <!-- PLACEHOLDER: no real order/purchase data model exists yet -- this
           is a visual placeholder only, not wired to any actual past
           orders. Replace once real accounts + an orders backend exist. -->
      <p class="checkout-empty-note" data-i18n="account.noOrdersYet">No orders yet — your past purchases will appear here.</p>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="shop-footer">
  <a href="index.html" class="shop-footer-wordmark">MONARK</a>
  <p class="shop-footer-copy" data-i18n="footer.copyright">&copy; 2025 MONARK. All rights reserved.</p>
  <nav class="footer-legal-links">
    <a href="faq.html" data-i18n="footer.faq">FAQ</a>
    <a href="contact.html" data-i18n="footer.contact">Contact</a>
    <a href="mentions-legales.html" data-i18n="footer.legalNotice">Legal Notice</a>
    <a href="cgv.html" data-i18n="footer.termsOfSale">Terms of Sale</a>
    <a href="confidentialite.html" data-i18n="footer.privacyPolicy">Privacy Policy</a>
  </nav>
</footer>

<script src="js/i18n.js?v=20260719"></script>
<script src="js/header-position-fix.js?v=20260719"></script>
<script src="js/footer-active-page.js?v=20260719"></script>
<script src="js/cart.js?v=20260719"></script>
<script src="js/cart-widget.js?v=20260719"></script>
<script src="js/nav-menu.js?v=20260719"></script>
<script src="js/account.js?v=20260719"></script>
<script>
(function () {
  const orderHistory = document.getElementById('account-order-history');
  function t(key, vars) { return window.MonarkI18n ? window.MonarkI18n.t(key, vars) : key; }
  // statusLabel/changeLabel passed as functions, not plain strings -- see
  // js/account.js's mountAccountGate() comment on why (re-invoked fresh on
  // every 'monark:langchange' so a language switch updates them in place).
  window.MonarkAccount.mountAccountGate(document.getElementById('account-gate'), {
    statusLabel: (session) => session.isGuest
      ? t('account.statusGuest', { email: session.email })
      : t('accountGate.loggedInAs', { email: session.email }),
    changeLabel: () => t('account.logOut'),
    onResolved: () => { orderHistory.hidden = false; },
    onUnresolved: () => { orderHistory.hidden = true; }
  });
})();
</script>
<script src="js/promo-banner.js?v=20260719"></script>
<script src="js/cookie-consent.js?v=20260719"></script>
<script src="js/email-popup.js?v=20260719"></script>
</body>
</html>
